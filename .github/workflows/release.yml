name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('custom_components/tesla_tedapi/manifest.json'))['version'])")
          echo "tag=$tag manifest=$version"
          test "$tag" = "$version"
