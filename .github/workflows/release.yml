name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('custom_components/tesla_tedapi/manifest.json'))['version'])")
          echo "tag=$tag manifest=$version"
          test "$tag" = "$version"

  zip:
    # HACS installs this zip (hacs.json: zip_release), so GitHub counts the
    # downloads. The integration's files sit at the top of the zip.
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build tesla_tedapi.zip
        run: |
          cd custom_components/tesla_tedapi
          zip -r -X "$GITHUB_WORKSPACE/tesla_tedapi.zip" . -x '*__pycache__*' '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/tesla_tedapi.zip" | grep -q ' manifest.json$'
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" tesla_tedapi.zip --clobber --repo "$GITHUB_REPOSITORY"
