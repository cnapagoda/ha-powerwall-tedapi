name: Hardware report
description: Tell us how the integration works on your Powerwall (helps the compatibility list)
labels: [hardware report]
body:
  - type: markdown
    attributes:
      value: |
        Reports from Powerwall 2, Powerwall+, expansion packs, several Powerwalls and new firmware are especially useful. They go into [Compatibility](https://github.com/cnapagoda/ha-powerwall-tedapi/blob/main/docs/compatibility.md).

        Only test what you're comfortable with. For dispatch or going off-grid, use short durations and a battery level limit, and read [Safety](https://github.com/cnapagoda/ha-powerwall-tedapi/blob/main/docs/safety.md) first.
  - type: dropdown
    id: model
    attributes:
      label: Powerwall model
      options:
        - Powerwall 3
        - Powerwall 3 with Expansion Pack(s)
        - Powerwall 3, three-phase
        - Powerwall 2
        - Powerwall+
        - Several Powerwalls
        - Other
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Powerwall firmware
      placeholder: "26.34.3"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "2.9.0"
    validations:
      required: true
  - type: dropdown
    id: gateway
    attributes:
      label: Gateway
      description: The part number starts the gateway's DIN (Tesla app, or the device page in Home Assistant).
      options:
        - Backup Gateway 1 (part number 1118431-…)
        - Backup Gateway 2 (1152100-… or 1232100-…)
        - Backup Gateway 3 or Backup Switch (Powerwall 3)
        - Don't know
  - type: input
    id: region
    attributes:
      label: Country or region
      placeholder: "Australia"
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Signed (v1r), home network address
        - Signed (v1r), Powerwall Wi-Fi hotspot
        - Wi-Fi password
    validations:
      required: true
  - type: dropdown
    id: solar
    attributes:
      label: Solar
      options:
        - On the Powerwall's built-in inputs
        - Separate solar inverter
        - Both
        - No solar
  - type: checkboxes
    id: works
    attributes:
      label: What works
      description: Tick what you tried and saw working.
      options:
        - label: Key registration (switch toggle confirmed the key)
        - label: Power, battery level and energy counters
        - label: Solar input sensors
        - label: Battery pack sensors (capacity, temperature, health)
        - label: Fan speed sensors
        - label: Changing operation mode, reserve, grid charging or export locally
        - label: Battery dispatch / freeze_battery / charge_to / discharge_to
        - label: Max backup
        - label: Go off-grid and reconnect
        - label: Dropped settings restored (restored_count goes up)
        - label: Network connection, site limits and registered keys sensors
  - type: checkboxes
    id: unconfirmed
    attributes:
      label: Not confirmed yet
      description: Nobody has reported these yet. Tick any you saw working, and describe it below.
      options:
        - label: "Powerwall+: fan speed and solar input sensors"
        - label: "Powerwall 2 with a Backup Gateway 2: setup and the signed connection"
        - label: "Several Powerwall 3s: inverter temperatures of the followers (Inverter 2 …)"
        - label: "Powerwall 3 three-phase: per-phase readings and battery dispatch"
  - type: textarea
    id: notes
    attributes:
      label: What didn't work, or anything unusual
      description: Missing sensors, odd values, error messages, alert codes the integration doesn't know.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: >-
        Drag the diagnostics file here (Settings → Devices & services → Tesla Powerwall TEDAPI → ⋮ →
        Download diagnostics). Passwords, keys, addresses and serial numbers are redacted, but please
        check the file before attaching it.
