rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: todo
    comment: >-
      pypowerwall is MIT-licensed, tagged on GitHub and on PyPI, but its PyPI
      releases are not built and uploaded by a public CI pipeline (no Trusted
      Publishing provenance). Upstream issue; nothing to change here.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      One device per gateway. Solar inputs, fans and battery packs that appear
      later are added without a reload.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      Leftover devices can be deleted from the UI (async_remove_config_entry_device);
      the live gateway's device cannot.
  # Platinum
  async-dependency:
    status: todo
    comment: >-
      pypowerwall is synchronous; its calls run in the executor.
  inject-websession:
    status: todo
    comment: >-
      pypowerwall uses requests and its own sessions, so Home Assistant's
      aiohttp session can't be passed in.
  strict-typing:
    status: todo
    comment: Not checked with mypy --strict yet, and there is no py.typed.
