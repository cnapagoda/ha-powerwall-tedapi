dispatch_battery_power:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    power_watts:
      required: true
      example: 2000
      selector:
        number:
          min: -30000
          max: 30000
          step: 100
          unit_of_measurement: W
          mode: box
    duration_seconds:
      required: true
      example: 1800
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    min_soc:
      required: false
      example: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    max_soc:
      required: false
      example: 95
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
freeze_battery:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    direction:
      required: true
      example: discharge_only
      selector:
        select:
          options:
            - charge_only
            - discharge_only
          translation_key: freeze_direction
    duration_seconds:
      required: true
      example: 1800
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    max_power_watts:
      required: false
      example: 5000
      selector:
        number:
          min: 100
          max: 30000
          step: 100
          unit_of_measurement: W
          mode: box
    min_soc:
      required: false
      example: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    max_soc:
      required: false
      example: 95
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
charge_to:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: box
    power_watts:
      required: true
      example: 3000
      selector:
        number:
          min: 100
          max: 30000
          step: 100
          unit_of_measurement: W
          mode: box
    max_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
discharge_to:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    target_soc:
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: box
    power_watts:
      required: true
      example: 3000
      selector:
        number:
          min: 100
          max: 30000
          step: 100
          unit_of_measurement: W
          mode: box
    max_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
resume_battery_operation:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
start_max_backup:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    duration_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 2880
          unit_of_measurement: min
          mode: box
cancel_max_backup:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
go_off_grid:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    confirm:
      required: true
      default: false
      selector:
        boolean:
    duration_minutes:
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    min_soc:
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    curtailment:
      required: false
      default: false
      selector:
        boolean:
    daily_limit_minutes:
      required: false
      example: 360
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
reconnect_grid:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    curtailment_only:
      required: false
      default: false
      selector:
        boolean:
get_tariff:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
set_tariff:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    tou_settings:
      required: true
      example: '{"tariff_content_v2": {"name": "My plan", "seasons": {}, "energy_charges": {}}}'
      selector:
        object:
    dry_run:
      required: false
      default: true
      selector:
        boolean:
    read_back:
      required: false
      default: full
      selector:
        select:
          options:
            - full
            - once
            - none
          translation_key: tariff_read_back
    only_if_changed:
      required: false
      default: false
      selector:
        boolean:
import_battery_history:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    dry_run:
      required: false
      default: true
      selector:
        boolean:
    source_charged:
      required: true
      selector:
        entity:
          domain: sensor
          device_class: energy
    source_discharged:
      required: true
      selector:
        entity:
          domain: sensor
          device_class: energy
    net:
      required: false
      default: false
      selector:
        boolean:
set_site_limit:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    direction:
      required: true
      example: export
      selector:
        select:
          options:
            - import
            - export
          translation_key: site_limit_direction
    limit_kw:
      required: false
      example: 5
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          unit_of_measurement: kW
          mode: box
    confirm:
      required: true
      default: false
      selector:
        boolean:
delay_battery_calibration:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    delay_hours:
      required: true
      example: 24
      selector:
        number:
          min: 1
          max: 168
          unit_of_measurement: h
          mode: box
remove_registered_key:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    fingerprint:
      required: true
      example: 0123456789abcdef
      selector:
        text:
    confirm:
      required: true
      default: false
      selector:
        boolean:
