dispatch_battery_power:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    power_watts:
      required: true
      example: 2000
      selector:
        number:
          min: -10000
          max: 10000
          step: 100
          unit_of_measurement: W
          mode: box
    duration_seconds:
      required: true
      example: 1800
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    min_soc:
      required: false
      example: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    max_soc:
      required: false
      example: 95
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
charge_to:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: box
    power_watts:
      required: true
      example: 3000
      selector:
        number:
          min: 100
          max: 10000
          step: 100
          unit_of_measurement: W
          mode: box
    max_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
discharge_to:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    target_soc:
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: box
    power_watts:
      required: true
      example: 3000
      selector:
        number:
          min: 100
          max: 10000
          step: 100
          unit_of_measurement: W
          mode: box
    max_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
resume_battery_operation:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
start_max_backup:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    duration_minutes:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 2880
          unit_of_measurement: min
          mode: box
cancel_max_backup:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
go_off_grid:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
    confirm:
      required: true
      default: false
      selector:
        boolean:
    duration_minutes:
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    min_soc:
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
reconnect_grid:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tesla_tedapi
