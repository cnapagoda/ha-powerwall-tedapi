blueprint:
  name: Powerwall - shed loads during a grid outage
  description: >-
    When the grid has been down for a few minutes, turn off the loads you
    choose so the battery lasts longer; when the grid is back, put them back
    the way they were. It can also wait until the battery falls below a
    level. Off-grid runs started with `tesla_tedapi.go_off_grid` don't count.
    Home Assistant and your network need power during the outage.
  domain: automation
  source_url: https://github.com/cnapagoda/ha-powerwall-tedapi/blob/main/blueprints/automation/tesla_tedapi/outage_load_shedding.yaml
  input:
    grid_connected:
      name: Powerwall Grid connected
      selector:
        entity:
          integration: tesla_tedapi
          domain: binary_sensor
    battery_level:
      name: Powerwall Battery level
      selector:
        entity:
          integration: tesla_tedapi
          domain: sensor
    loads:
      name: Loads to turn off
      description: For example a pool pump, hot water, a heater or a charger.
      selector:
        entity:
          multiple: true
          domain:
            - switch
            - light
            - fan
            - climate
            - water_heater
            - humidifier
            - input_boolean
    minutes:
      name: After the grid has been down for
      description: Ignore short interruptions.
      default: 1
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    below:
      name: Only when the battery is below
      description: At 100 % the loads go off as soon as the time above has passed.
      default: 100
      selector:
        number:
          min: 5
          max: 100
          unit_of_measurement: "%"
    restore:
      name: Put the loads back when the grid returns
      description: >-
        Loads that were on are turned on again; loads that were off stay off.
        If Home Assistant restarts during the outage, they stay off.
      default: true
      selector:
        boolean:

mode: queued
max: 5

variables:
  grid_connected: !input grid_connected
  battery_level: !input battery_level
  below: !input below
  restore: !input restore
  scene: "scene.powerwall_shed_{{ this.entity_id.split('.')[1] }}"

triggers:
  - trigger: state
    id: down
    entity_id: !input grid_connected
    to: "off"
    for:
      minutes: !input minutes
  - trigger: numeric_state
    id: down
    entity_id: !input battery_level
    below: !input below
  - trigger: state
    id: up
    entity_id: !input grid_connected
    to: "on"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: down
          - condition: state
            entity_id: !input grid_connected
            state: "off"
          - condition: template
            value_template: >-
              {{ not state_attr(grid_connected, 'off_grid_run')
                 and (below >= 100 or states(battery_level) | float(0) < below)
                 and states[scene] is none }}
        sequence:
          - action: scene.create
            data:
              scene_id: "{{ scene.split('.')[1] }}"
              snapshot_entities: !input loads
          - action: homeassistant.turn_off
            target:
              entity_id: !input loads
      - conditions:
          - condition: trigger
            id: up
          - condition: template
            value_template: "{{ states[scene] is not none }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ restore }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ scene }}"
          - action: scene.delete
            target:
              entity_id: "{{ scene }}"
